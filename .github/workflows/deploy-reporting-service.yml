# Deploys reporting-service when its registry manifest changes.
# Legacy: reporting still runs on the old Azure subscription — DATA-311.
name: Deploy reporting-service

on:
  push:
    branches: [main]
    paths:
      - 'registry/reporting-service.yml'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: data
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Azure
        if: vars.DEPLOY_ENABLED == 'true'
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Redeploy service
        if: vars.DEPLOY_ENABLED == 'true'
        run: az webapp restart --name reporting-service --resource-group tanuki-data
