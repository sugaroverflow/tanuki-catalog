# Validate and plan infra changes (catalog snapshot bucket).
name: Infra plan

on:
  pull_request:
    paths:
      - 'infra/**'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  plan:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.9.8'

      - name: terraform fmt
        run: terraform fmt -check -diff

      - name: terraform validate
        run: |
          terraform init -backend=false -input=false
          terraform validate

      - name: Authenticate to Google Cloud
        if: vars.DEPLOY_ENABLED == 'true'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/000000000000/locations/global/workloadIdentityPools/tanuki-ci/providers/github
          service_account: tanuki-infra-ci@tanuki-services-prod.iam.gserviceaccount.com

      - name: terraform plan
        if: vars.DEPLOY_ENABLED == 'true'
        run: terraform plan -input=false
