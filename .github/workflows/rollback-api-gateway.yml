# Manual rollback for api-gateway: pin the service to an earlier task definition.
name: Rollback api-gateway

on:
  workflow_dispatch:
    inputs:
      revision:
        description: 'ECS task definition revision to roll back to'
        type: string
        required: true
      environment:
        description: 'Target environment'
        type: choice
        options: [staging, production]
        default: staging

permissions:
  id-token: write
  contents: read

jobs:
  rollback:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - name: Configure AWS credentials
        if: vars.DEPLOY_ENABLED == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::210987654321:role/tanuki-deploy-platform
          aws-region: us-east-1

      - name: Roll back service
        if: vars.DEPLOY_ENABLED == 'true'
        run: |
          aws ecs update-service --cluster platform --service api-gateway \
            --task-definition api-gateway:${{ inputs.revision }}
