# Deploys metrics-collector when its registry manifest changes.
name: Deploy metrics-collector

on:
  push:
    branches: [main]
    paths:
      - 'registry/metrics-collector.yml'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: platform
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        if: vars.DEPLOY_ENABLED == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::210987654321:role/tanuki-deploy-platform
          aws-region: us-east-1

      - name: Publish manifest
        if: vars.DEPLOY_ENABLED == 'true'
        run: aws s3 cp registry/metrics-collector.yml s3://tanuki-prod-registry/metrics-collector.yml

      - name: Redeploy service
        if: vars.DEPLOY_ENABLED == 'true'
        run: aws ecs update-service --cluster platform --service metrics-collector --force-new-deployment
