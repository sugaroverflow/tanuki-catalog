# Smoke check: platform services must resolve in the catalog after registry changes.
name: Smoke platform

on:
  push:
    branches: [main]
    paths:
      - 'registry/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Tanuki env
        uses: ./.github/actions/setup-tanuki-env

      - name: Verify platform services resolve
        run: |
          go build -o tanuki ./cmd/tanuki
          ./tanuki search --team platform
          ./tanuki status api-gateway
