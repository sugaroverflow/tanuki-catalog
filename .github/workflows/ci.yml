# CI on every push and PR: validate registry, test matrix, build artifacts.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  checks: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build catalog (validates all manifests)
        uses: ./.github/actions/catalog-tools

  test:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        go: ['1.24', '1.25']
        os: [ubuntu-latest, macos-latest, windows-latest]
        exclude:
          # 1.24 toolchain flake on windows-2022 runners; see PLAT-1861
          - go: '1.24'
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Tanuki env
        uses: ./.github/actions/setup-tanuki-env
        with:
          go-version: ${{ matrix.go }}

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go${{ matrix.go }}-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go${{ matrix.go }}-

      - name: Install gotestsum
        run: go install gotest.tools/gotestsum@v1.13.0

      - name: Run tests
        # bash everywhere: PowerShell splits -coverprofile=coverage.out at the dot
        shell: bash
        run: gotestsum --junitfile junit.xml -- -coverprofile=coverage.out ./...

      - name: Publish test report
        uses: mikepenz/action-junit-report@v5
        if: always() && matrix.os == 'ubuntu-latest'
        with:
          report_paths: junit.xml
          check_name: tests (go ${{ matrix.go }})

      - name: Upload coverage
        uses: codecov/codecov-action@v5
        if: matrix.os == 'ubuntu-latest' && matrix.go == '1.25'
        continue-on-error: true
        with:
          files: coverage.out

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            suffix: ''
          - os: macos-latest
            goos: darwin
            goarch: arm64
            suffix: ''
          - os: windows-latest
            goos: windows
            goarch: amd64
            suffix: .exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Tanuki env
        uses: ./.github/actions/setup-tanuki-env

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build -o tanuki-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.suffix }} ./cmd/tanuki

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tanuki-${{ matrix.goos }}-${{ matrix.goarch }}
          path: tanuki-*
          retention-days: 7
