# Validate registry changes and report which teams are affected.
name: Registry lint

on:
  pull_request:
    paths:
      - 'registry/**'
      - 'catalog.schema.json'
  push:
    branches: [main]
    paths:
      - 'registry/**'
      - 'catalog.schema.json'

permissions:
  contents: read
  pull-requests: write

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      manifests: ${{ steps.changed.outputs.all_changed_files }}
      teams: ${{ steps.filter.outputs.changes }}
    steps:
      - uses: actions/checkout@v4

      - name: List changed manifests
        id: changed
        uses: tj-actions/changed-files@v45
        with:
          files: registry/**

      - name: Classify by team
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            platform:
              - 'registry/api-gateway.yml'
              - 'registry/auth-service.yml'
              - 'registry/session-cache.yml'
              - 'registry/feature-flags.yml'
              - 'registry/metrics-collector.yml'
            payments:
              - 'registry/payments-api.yml'
              - 'registry/billing-worker.yml'
              - 'registry/webhook-dispatcher.yml'
              - 'registry/inventory-service.yml'
            experience:
              - 'registry/tanuki-notify.yml'
              - 'registry/search-api.yml'
            data:
              - 'registry/data-pipeline.yml'
              - 'registry/reporting-service.yml'

  validate:
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate registry
        run: python scripts/build_catalog.py --validate

      - name: Summarize
        run: |
          echo "Changed manifests: ${{ needs.changes.outputs.manifests }}"
          echo "Affected teams: ${{ needs.changes.outputs.teams }}"

      - name: Comment on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const changed = `${{ needs.changes.outputs.manifests }}`.trim();
            const teams = `${{ needs.changes.outputs.teams }}`;
            const body = changed
              ? `✅ Registry validation passed for \`${changed}\` (teams: ${teams})`
              : '✅ Registry validation passed.';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
